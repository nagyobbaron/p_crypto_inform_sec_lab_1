---
- name: Install sensor nftables policy
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0600'
  notify: Apply sensor nftables policy

- name: Validate nftables policy
  ansible.builtin.command: nft --check --file /etc/nftables.conf
  changed_when: false

- name: Enable nftables at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
